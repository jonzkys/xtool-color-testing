[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xcs-gen"
version = "0.1.0"
description = "Programmatic generation of XTool .xcs laser cutter files"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "Pillow>=10.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "svgelements>=1.9",
    "shapely>=2.0",
    "pyyaml>=6.0",
    "vtracer>=0.6",
    "opencv-contrib-python-headless>=4.8",
    "segno>=1.6",
    "numpy>=1.24",
    "pyzbar>=0.1.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "fonttools>=4.60",
]
# Install with `pip install -e ".[mysql]"` to use MySQL/MariaDB as the
# backend. Pure-Python driver (no C toolchain required) — set
# XCS_GEN_DB_URL="mysql+pymysql://user:pass@host/xcsgen?charset=utf8mb4"
# and run migrations.
mysql = [
    "pymysql>=1.1",
]
# Install with `pip install -e ".[s3]"` to store result photos in S3.
# boto3 auth comes from the default credential chain (IAM role /
# env / ~/.aws) — the app never holds long-lived keys. Set
# XCS_GEN_S3_BUCKET=your-bucket to activate.
s3 = [
    "boto3>=1.34",
]

[project.scripts]
xcs-gen = "xcs_gen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
]
