[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xcs-gen"
version = "0.1.0"
description = "Programmatic generation of XTool .xcs laser cutter files"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "Pillow>=10.0",
    # iPhone-default photo format. ``pillow_heif.register_heif_opener()``
    # in capture_pipeline.py extends Pillow's Image.open with HEIC/HEIF
    # support. Self-contained manylinux wheels bundle libheif, so no
    # apt-get changes on the runtime image.
    "pillow-heif>=0.16",
    "fastapi>=0.110",
    # python-multipart is required by FastAPI for UploadFile / File()
    # parsing (the image-upload endpoints). Not auto-installed by
    # fastapi; listed explicitly so a clean `pip install .` works.
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.27",
    "svgelements>=1.9",
    "shapely>=2.0",
    "pyyaml>=6.0",
    # vtracer was dropped when raster-to-SVG tracing moved to the
    # browser (web/src/tracer/vtracer.ts uses vtracer-wasm). The Rust
    # core is the same; only the call site moved.
    "opencv-contrib-python-headless>=4.8",
    "segno>=1.6",
    "numpy>=1.24",
    "pyzbar>=0.1.9",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "scikit-learn>=1.7.2",
    # Sentry — initialised at app startup ONLY when XCS_GEN_SENTRY_DSN
    # is set. Listed as a hard dependency rather than an extra so the
    # runtime is identical regardless of whether a deploy enables error
    # reporting; the import is essentially free when the SDK is never
    # initialised.
    "sentry-sdk[fastapi]>=2.0",
]

[project.optional-dependencies]
dev = [
    "fonttools>=4.60",
]
# Install with `pip install -e ".[mysql]"` to use MySQL/MariaDB as the
# backend. The [rsa] extra on pymysql pulls in `cryptography`, which
# is required for MySQL 8's default auth plugin (caching_sha2_password)
# — without it pymysql falls over with:
#   RuntimeError: 'cryptography' package is required for
#                  sha256_password or caching_sha2_password auth methods
# set XCS_GEN_DB_URL="mysql+pymysql://user:pass@host/xcsgen?charset=utf8mb4"
# and run migrations.
mysql = [
    "pymysql[rsa]>=1.1",
]
# Install with `pip install -e ".[s3]"` to store result photos in S3.
# boto3 auth comes from the default credential chain (IAM role /
# env / ~/.aws) — the app never holds long-lived keys. Set
# XCS_GEN_S3_BUCKET=your-bucket to activate.
s3 = [
    "boto3>=1.34",
]
# Everything CI needs to run `pytest tests/`. Kept as an explicit extra
# (rather than lumped into `dev`) so CI doesn't pull in tooling it
# doesn't use. httpx is required by fastapi's TestClient.
test = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
xcs-gen = "xcs_gen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# Include non-Python data files inside the packaged wheels. Without
# this, `pip install .` (non-editable) leaves font_data.json behind
# and text_height() fails at runtime. Editable installs accidentally
# work because they reference the source tree directly.
[tool.setuptools.package-data]
"xcs_gen" = ["font_data.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keep pytest out of git worktree subtrees so their src/ directories
# don't shadow the main repo's ``xcs_gen_web`` package during imports.
norecursedirs = [".worktrees", ".git", ".venv", "node_modules", "web"]
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
]
