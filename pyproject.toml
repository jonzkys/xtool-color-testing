[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xcs-gen"
version = "0.1.0"
description = "Programmatic generation of XTool .xcs laser cutter files"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["Pillow>=10.0", "fastapi>=0.110", "uvicorn[standard]>=0.27"]

[project.scripts]
xcs-gen = "xcs_gen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
