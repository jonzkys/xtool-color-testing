[[package]]
name = "xcs-gen"
version = "0.1.0"
source = { editable = "." }
dependencies = [
    { name = "alembic" },
    { name = "fastapi" },
    { name = "gunicorn" },
    { name = "numpy", version = "2.2.6", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version < '3.11'" },
    { name = "numpy", version = "2.4.4", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version >= '3.11'" },
    { name = "opencv-contrib-python-headless" },
    { name = "pillow" },
    { name = "pillow-heif" },
    { name = "python-multipart" },
    { name = "pyyaml" },
    { name = "pyzbar" },
    { name = "scikit-learn", version = "1.7.2", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version < '3.11'" },
    { name = "scikit-learn", version = "1.8.0", source = { registry = "https://pypi.org/simple" }, marker = "python_full_version >= '3.11'" },
    { name = "segno" },
    { name = "sentry-sdk", extra = ["fastapi"] },
    { name = "shapely" },
    { name = "sqlalchemy" },
    { name = "svgelements" },
    { name = "uvicorn", extra = ["standard"] },
]

[package.optional-dependencies]
dev = [
    { name = "fonttools" },
]
mysql = [
    { name = "pymysql", extra = ["rsa"] },
]
s3 = [
    { name = "boto3" },
]
test = [
    { name = "httpx" },
    { name = "pytest" },
]

[package.metadata]
requires-dist = [
    { name = "alembic", specifier = ">=1.13" },
    { name = "boto3", marker = "extra == 's3'", specifier = ">=1.34" },
    { name = "fastapi", specifier = ">=0.110" },
    { name = "fonttools", marker = "extra == 'dev'", specifier = ">=4.60" },
    { name = "gunicorn", specifier = ">=22.0,<24" },
    { name = "httpx", marker = "extra == 'test'", specifier = ">=0.27" },
    { name = "numpy", specifier = ">=1.24" },
    { name = "opencv-contrib-python-headless", specifier = ">=4.8" },
    { name = "pillow", specifier = ">=10.0" },
    { name = "pillow-heif", specifier = ">=0.16" },
    { name = "pymysql", extras = ["rsa"], marker = "extra == 'mysql'", specifier = ">=1.1" },
    { name = "pytest", marker = "extra == 'test'", specifier = ">=8.0" },
    { name = "python-multipart", specifier = ">=0.0.9" },
    { name = "pyyaml", specifier = ">=6.0" },
    { name = "pyzbar", specifier = ">=0.1.9" },
    { name = "scikit-learn", specifier = ">=1.7.2" },
    { name = "segno", specifier = ">=1.6" },
    { name = "sentry-sdk", extras = ["fastapi"], specifier = ">=2.0" },
    { name = "shapely", specifier = ">=2.0" },
    { name = "sqlalchemy", specifier = ">=2.0" },
    { name = "svgelements", specifier = ">=1.9" },
    { name = "uvicorn", extras = ["standard"], specifier = ">=0.27" },
]
provides-extras = ["dev", "mysql", "s3", "test"]
