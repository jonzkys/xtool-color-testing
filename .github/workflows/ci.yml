name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pyzbar wraps libzbar via ctypes — not a Python wheel, needs the
      # native library present on the runner.
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libzbar0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Install with the same extras CI would ship in production so
      # dependency drift shows up in the test matrix rather than in prod.
      # [test] carries pytest + httpx (required by fastapi.TestClient).
      - name: Install dependencies
        run: pip install ".[mysql,s3,test]"

      - name: Run tests
        env:
          # Each test's `fresh_db` fixture migrates its own temp SQLite
          # file — we don't want the module-level `app = create_app()`
          # kicking off a second migration against ~/.xcs-gen/ on import.
          XCS_GEN_AUTO_MIGRATE: "false"
        run: pytest tests/ -x -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check and build
        run: npm run build

      - name: Unit tests
        run: npm test -- --run

  mysql-migration-test:
    # Smoke-test that migrations actually apply against real MySQL —
    # SQLite silently accepts things MySQL rejects (DEFAULT on TEXT,
    # TEXT primary keys, CHANGE COLUMN without full redefine, etc.)
    # so the regular pytest suite can't catch those. This job ran
    # retroactively would have flagged the 1101 TEXT+DEFAULT bug
    # before it ever hit ECS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Start a real MySQL 8 with the same collation prod uses. Can't
      # use `services:` — MySQL's collation-server is a CMD arg, and
      # services: only lets you pass env vars. So we spin it up with
      # `docker run` for full control.
      - name: Start MySQL 8
        run: |
          docker run --rm -d --name mysql-ci \
            -e MYSQL_ROOT_PASSWORD=rootpass \
            -e MYSQL_DATABASE=xcsgen \
            -e MYSQL_USER=xcsgen \
            -e MYSQL_PASSWORD=xcsgenpass \
            -p 3306:3306 \
            mysql:8.0 \
            --character-set-server=utf8mb4 \
            --collation-server=utf8mb4_bin

      - name: Wait for MySQL to be ready
        # Actually-authenticated query, not just `mysqladmin ping` —
        # ping returns success the moment the socket answers, but the
        # image's entrypoint keeps running init SQL in parallel AFTER
        # that point (including setting the root password and creating
        # the MYSQL_USER). Using real SELECTs as the probe avoids the
        # race where a subsequent step tries to authenticate before
        # init finishes. We require BOTH root (for admin commands) AND
        # xcsgen (proves the MYSQL_USER init step has completed) to
        # authenticate — probing only root raced against the GRANT
        # step below, which then tripped ER_CANT_GRANT_WITH_CREATE_USER
        # (MySQL 8 refuses implicit user-creation via GRANT).
        run: |
          for i in $(seq 1 60); do
            if docker exec mysql-ci mysql -uroot -prootpass -e "SELECT 1" >/dev/null 2>&1 \
               && docker exec mysql-ci mysql -uxcsgen -pxcsgenpass -e "SELECT 1" >/dev/null 2>&1; then
              echo "MySQL + xcsgen user ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "MySQL did not become ready within 60s" >&2
          docker logs mysql-ci
          exit 1

      - name: Grant the same privileges prod uses
        run: |
          docker exec mysql-ci mysql -uroot -prootpass -e "
            GRANT SELECT, INSERT, UPDATE, DELETE,
                  CREATE, ALTER, INDEX, REFERENCES, DROP
              ON xcsgen.* TO 'xcsgen'@'%';
            FLUSH PRIVILEGES;"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install alembic + pymysql
        # [mysql] extra brings pymysql; alembic is a core runtime dep.
        run: pip install ".[mysql]"

      - name: Run alembic upgrade head against MySQL (fresh)
        env:
          XCS_GEN_DB_URL: "mysql+pymysql://xcsgen:xcsgenpass@127.0.0.1:3306/xcsgen?charset=utf8mb4"
        run: alembic upgrade head

      - name: Verify final revision is head
        run: |
          VER=$(docker exec mysql-ci mysql -N -uxcsgen -pxcsgenpass xcsgen \
            -e "SELECT version_num FROM alembic_version" 2>/dev/null)
          echo "alembic_version = $VER"
          # Update this when a new migration is added.
          test "$VER" = "0013"

      - name: Run alembic upgrade head AGAIN (idempotence check)
        # Should be a no-op — alembic sees it's at head and exits. A
        # non-zero status here means migrations aren't idempotent.
        env:
          XCS_GEN_DB_URL: "mysql+pymysql://xcsgen:xcsgenpass@127.0.0.1:3306/xcsgen?charset=utf8mb4"
        run: alembic upgrade head

      - name: MySQL logs on failure
        if: failure()
        run: docker logs mysql-ci

      - name: Stop MySQL
        if: always()
        run: docker stop mysql-ci

  docker-build:
    # Sanity-check that the production Dockerfile actually builds. Doesn't
    # push anything — that's deploy.yml's job — but failing here on a PR
    # means broken Dockerfiles never reach main.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: xcs-gen:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
