name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pyzbar wraps libzbar via ctypes — not a Python wheel, needs the
      # native library present on the runner.
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libzbar0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Install with the same extras CI would ship in production so
      # dependency drift shows up in the test matrix rather than in prod.
      - name: Install dependencies
        run: pip install ".[mysql,s3]" pytest

      - name: Run tests
        run: pytest tests/ -x -q

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check and build
        run: npm run build

      - name: Unit tests
        run: npm test -- --run

  docker-build:
    # Sanity-check that the production Dockerfile actually builds. Doesn't
    # push anything — that's deploy.yml's job — but failing here on a PR
    # means broken Dockerfiles never reach main.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: xcs-gen:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
